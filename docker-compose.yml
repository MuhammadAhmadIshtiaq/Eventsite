version: '3.8'

services:
  # Tier 3: Database Persistence Tier
  database:
    image: postgres:16-alpine
    container_name: nascon-postgres
    restart: always
    environment:
      POSTGRES_DB: nascon_db
      POSTGRES_USER: nascon_user
      POSTGRES_PASSWORD: nascon_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nascon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon_user -d nascon_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tier 2: Backend Logic Tier
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nascon-backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: nascon_db
      DB_USER: nascon_user
      DB_PASSWORD: nascon_password
      JWT_SECRET: nascon-super-secret-key-2026
    ports:
      - "5000:5000"
    networks:
      nascon-network:
        aliases:
          - nascon-backend-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Tier 1: Frontend Presentation Tier
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nascon-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - nascon-network

volumes:
  postgres_data:

networks:
  nascon-network:
    driver: bridge
