apiVersion: apps/v1
kind: Deployment
metadata:
  name: nascon-frontend
  namespace: nascon
  labels:
    app: nascon-frontend
    tier: presentation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nascon-frontend
  template:
    metadata:
      labels:
        app: nascon-frontend
        tier: presentation
    spec:
      containers:
        - name: frontend
          image: nascon-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nascon-frontend-service
  namespace: nascon
  labels:
    app: nascon-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app: nascon-frontend

