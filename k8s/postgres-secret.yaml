apiVersion: v1
kind: Secret
metadata:
  name: nascon-db-secret
  namespace: nascon
type: Opaque
stringData:
  POSTGRES_DB: nascon_db
  POSTGRES_USER: nascon_user
  POSTGRES_PASSWORD: nascon_password
  JWT_SECRET: nascon-super-secret-key-2026
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: nascon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

