apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: nascon
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        email VARCHAR(120) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        university VARCHAR(150) NOT NULL,
        student_id VARCHAR(50),
        phone VARCHAR(20),
        role VARCHAR(20) DEFAULT 'student',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS events (
        id SERIAL PRIMARY KEY,
        title VARCHAR(150) NOT NULL,
        category VARCHAR(50) NOT NULL,
        description TEXT NOT NULL,
        team_size_min INT DEFAULT 1,
        team_size_max INT DEFAULT 4,
        registration_fee NUMERIC(10, 2) DEFAULT 0.00,
        prize_pool VARCHAR(100),
        venue VARCHAR(100) NOT NULL,
        event_date VARCHAR(50) NOT NULL,
        rules TEXT,
        icon VARCHAR(50) DEFAULT 'code',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS registrations (
        id SERIAL PRIMARY KEY,
        user_id INT REFERENCES users(id) ON DELETE CASCADE,
        event_id INT REFERENCES events(id) ON DELETE CASCADE,
        team_name VARCHAR(100) NOT NULL,
        leader_name VARCHAR(100) NOT NULL,
        leader_email VARCHAR(120) NOT NULL,
        leader_phone VARCHAR(20) NOT NULL,
        members TEXT,
        status VARCHAR(30) DEFAULT 'CONFIRMED',
        registered_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO events (title, category, description, team_size_min, team_size_max, registration_fee, prize_pool, venue, event_date, rules)
    VALUES 
    ('Speed Programming Battle', 'Coding', 'Intense competitive programming contest testing algorithms, data structures, and speed.', 1, 3, 1500.00, 'PKR 75,000', 'Computing Lab 3 & 4', 'Day 1 - 10:00 AM', 'ICPC rules.'),
    ('Web & App Hackathon', 'Development', '24-hour sprint to build full-stack software solutions.', 2, 4, 2500.00, 'PKR 100,000', 'Incubation Center', 'Day 1 - 02:00 PM', 'Original code only.'),
    ('Capture The Flag (CTF)', 'Cyber Security', 'Jeopardy & attack-defense cybersecurity challenges.', 1, 3, 1800.00, 'PKR 60,000', 'Network Security Lab', 'Day 2 - 09:30 AM', 'No attacking infrastructure.'),
    ('RoboRace & Maze Runner', 'Robotics', 'Micro-robot navigation across high-complexity obstacle courses.', 1, 4, 2000.00, 'PKR 80,000', 'Gymnasium Arena', 'Day 2 - 11:00 AM', 'Chassis max 30x30 cm.'),
    ('AI & Data Science Challenge', 'Artificial Intelligence', 'Predictive ML models and GenAI applications on real datasets.', 1, 3, 2000.00, 'PKR 70,000', 'Data Science Lab', 'Day 2 - 01:00 PM', 'Evaluated on F1-score.'),
    ('E-Sports Arena (Valorant & FIFA)', 'Gaming', 'Collegiate multi-platform e-sports tournament.', 1, 5, 2500.00, 'PKR 50,000', 'Auditorium Hall', 'Day 3 - 10:00 AM', 'Fair play conduct.')
    ON CONFLICT DO NOTHING;

