version: '3.8'

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-server
    restart: always
    privileged: true
    user: root
    ports:
      - "8085:8080"      # Jenkins Web Dashboard
      - "50000:50000"    # Jenkins Agent Port
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount Docker socket to allow Jenkins to build & run containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount kubeconfig to allow Jenkins to deploy to Minikube
      - ~/.kube:/root/.kube:ro
    networks:
      - jenkins-network

volumes:
  jenkins_home:

networks:
  jenkins-network:
    driver: bridge

